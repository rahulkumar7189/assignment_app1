<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AcadMate</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
    <style>
        .helper-note {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-size: 0.82rem;
            color: #1e40af;
            margin-bottom: 1rem;
        }
        .disclaimer-box {
            background: #fefce8;
            border: 1px solid #fde047;
            border-radius: 0.5rem;
            padding: 1rem;
            margin: 1rem 0;
            font-size: 0.78rem;
            color: #713f12;
            line-height: 1.5;
        }
        .disclaimer-box label {
            display: flex;
            gap: 0.6rem;
            align-items: flex-start;
            cursor: pointer;
        }
        .disclaimer-box input[type="checkbox"] {
            margin-top: 2px;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .optional-tag {
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 400;
            margin-left: 0.3rem;
        }
    </style>
</head>

<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%);padding:2rem 1rem;">
    <div class="auth-card" style="width:100%;max-width:440px;">
        <div style="text-align:center;margin-bottom:2rem;">
            <a href="index.html" class="logo" style="justify-content:center;margin-bottom:1rem;">
                <i class="fas fa-graduation-cap"></i> AcadMate
            </a>
            <h2>Join AcadMate</h2>
            <p style="color:var(--secondary);">Choose your role and start your journey</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" class="form-input" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">College Email</label>
                <input type="email" id="email" class="form-input" placeholder="you@college.edu" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" class="form-input" placeholder="9876543210" required>
            </div>

            <div class="form-group">
                <label for="role">I am a...</label>
                <select id="role" class="form-input" required>
                    <option value="student">Student (Needs Help)</option>
                    <option value="helper">Helper (Provides Guidance)</option>
                </select>
            </div>

            <!-- Helper info note -->
            <div id="helperNote" style="display:none;">
                <div class="helper-note">
                    <i class="fas fa-info-circle"></i>
                    As a helper, students pay <strong>&#8377;20</strong> to unlock your contact details.
                    You then arrange all work and payment directly with the student — the platform does not handle assignment payments.
                </div>
            </div>

            <!-- Contact fields shown for helpers (all users can fill them) -->
            <div id="contactFields" style="display:none;">
                <div class="form-group">
                    <label for="whatsapp">WhatsApp Number <span class="optional-tag">(optional)</span></label>
                    <input type="tel" id="whatsapp" class="form-input" placeholder="+91 9876543210">
                </div>
                <div class="form-group">
                    <label for="telegram">Telegram ID <span class="optional-tag">(optional)</span></label>
                    <input type="text" id="telegram" class="form-input" placeholder="@username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-group">
                    <input type="password" id="password" class="form-input" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required>
                    <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                </div>
            </div>

            <!-- Legal Disclaimer — required checkbox -->
            <div class="disclaimer-box">
                <label>
                    <input type="checkbox" id="disclaimerCheck" required>
                    <span>
                        I have read and agree: <strong>Assignment Helper acts only as a connection platform between Students and Helpers.</strong>
                        The platform's sole service is facilitating introductions and unlocking contact details after payment of the platform fee.
                        Any agreement, payment, communication, service, deliverable, dispute, fraud, misconduct, plagiarism, academic integrity violation,
                        copyright infringement, non-payment, poor-quality work, harassment, or any other issue arising between Students and Helpers is
                        solely their responsibility. Assignment Helper shall not be liable for any direct, indirect, incidental, consequential, legal,
                        academic, financial, or reputational damages resulting from interactions between users.
                    </span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;padding:1rem;">
                Create Account
            </button>
            <p style="text-align:center;margin-top:1.5rem;color:var(--secondary);">
                Already have an account?
                <a href="login.html" style="color:var(--primary);font-weight:600;text-decoration:none;">Login</a>
            </p>
        </form>
    </div>

    <script>
        const IS_LOCAL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const API_URL  = IS_LOCAL ? 'http://localhost:8000/api/v1' : 'https://assignment-app1-gdya.onrender.com/api/v1';

        document.getElementById('role').addEventListener('change', function () {
            const isHelper = this.value === 'helper';
            document.getElementById('helperNote').style.display = isHelper ? 'block' : 'none';
            document.getElementById('contactFields').style.display = isHelper ? 'block' : 'none';
        });

        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            if (!document.getElementById('disclaimerCheck').checked) {
                alert('Please read and accept the disclaimer to continue.');
                return;
            }

            const btn = this.querySelector('[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            const whatsapp = document.getElementById('whatsapp').value.trim();
            const telegram = document.getElementById('telegram').value.trim();

            const payload = {
                name:             document.getElementById('name').value,
                email:            document.getElementById('email').value,
                phone_number:     document.getElementById('phone').value,
                role:             document.getElementById('role').value,
                password:         document.getElementById('password').value,
                whatsapp_number:  whatsapp || null,
                telegram_id:      telegram || null,
            };

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    alert('Registration successful! Please login.');
                    window.location.href = 'login.html';
                } else {
                    alert(data.detail || 'Registration failed');
                }
            } catch (err) {
                alert('Network error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('togglePassword');
            const pwd = document.getElementById('password');
            toggle?.addEventListener('click', function () {
                pwd.type = pwd.type === 'password' ? 'text' : 'password';
                this.classList.toggle('fa-eye-slash');
            });
        });
    </script>
</body>

</html>
